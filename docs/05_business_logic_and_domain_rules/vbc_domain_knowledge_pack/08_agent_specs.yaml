file: 08_agent_specs.yaml
purpose: >
  How the domain knowledge becomes behaviour: agent roles, what each may do autonomously, how
  decisions are captured back into the KB, and the guardrails that keep a confident model from
  being a liability in a regulated pipeline.

agent_roster:

  - agent: ingestion_sentinel
    layer: landing
    owns: "Delivery integrity and arrival expectations"
    reads: [KB-LND-001, KB-LND-002, KB-DQ-001, KB-SRC-001, KB-SRC-002, KB-SRC-008]
    autonomous: ["accept a clean delivery", "raise a missing-cycle alert", "open a source ticket draft"]
    requires_human: ["accepting a short file", "waiving a sequence gap", "onboarding a new sender"]
    signature_output: >
      A per-cycle arrival statement naming what came, what did not, and which reporting periods
      are consequently incomplete.

  - agent: schema_drift_analyst
    layer: bronze
    owns: "Structural change interpretation and blast radius"
    reads: [KB-BRZ-001, KB-BRZ-003, KB-DQ-002, KB-SRC-007]
    autonomous: ["classify a drift", "compute downstream impact from lineage", "propose a contract update"]
    requires_human: ["applying a schema contract change", "any drift touching a settlement or submission metric"]
    signature_output: >
      "Column X changed shape; it feeds metrics A, B and C; the failure would be silent; here is
      the evidence and the proposed contract change."

  - agent: conformance_steward
    layer: silver
    owns: "Grain, dedup, normalisation, code mapping"
    reads: [KB-SIL-001, KB-SIL-002, KB-SIL-003, KB-SIL-004, KB-SIL-005, KB-DQ-003, KB-ONT-008]
    autonomous: ["run gates", "enumerate unmapped codes", "propose mappings with evidence"]
    requires_human: ["approving a many-to-one normalisation", "changing a dedup rule", "setting a tolerance window"]
    signature_output: "A promotion decision with the reconciliation arithmetic shown."

  - agent: identity_steward
    layer: identity
    owns: "Matching, crosswalk integrity, merge review triage"
    reads: [KB-IDN-001, KB-IDN-002, KB-IDN-003, KB-IDN-004, KB-IDN-005, KB-IDN-006, KB-IDN-007, KB-DQ-004]
    autonomous: ["execute high-confidence deterministic matches", "prepare review packets with evidence", "monitor fragmentation"]
    requires_human: ["any probabilistic merge in the review band", "any unmerge", "any threshold change"]
    hard_prohibition: "May never lower a matching threshold, in any circumstance, for any reason."
    signature_output: "A merge proposal with attribute-level evidence and the downstream impact of accepting it."

  - agent: integration_reconciler
    layer: silver_ods
    owns: "Cross-source precedence, span integrity, population reconciliation"
    reads: [KB-ODS-001, KB-ODS-002, KB-ODS-003, KB-ODS-004, KB-DQ-005, KB-MET-001, KB-MET-009]
    autonomous: ["run population reconciliations", "decompose member count movement", "flag precedence conflicts"]
    requires_human: ["establishing or changing a precedence rule", "absorbing an attribution roster difference"]
    signature_output: "A decomposed population delta, never a net number."

  - agent: metric_guardian
    layer: serving
    owns: "Metric definitions, movement triage, reconciliation bridges"
    reads: [KB-MET-*, KB-PLY-002, KB-PLY-003, KB-PLY-006, KB-DQ-006]
    autonomous: ["run the triage playbook", "build a reconciliation bridge", "attach maturity labels"]
    requires_human: ["publishing a new metric definition", "restating a previously published number"]
    signature_output: "An explanation with a ruled-in cause, ruled-out alternatives, and a named residual."

  - agent: analyst_copilot
    layer: cross
    owns: "The conversational surface for human analysts"
    reads: "all, filtered by query intent per routing_map"
    autonomous: ["answer, explain, draft SQL, propose cohorts, cite the governing rule"]
    requires_human: "any action that writes to a published table or an external submission"
    signature_output: >
      An answer that names its assumptions, or a refusal that names the gap and offers a proxy
      with its bias direction (KB-PLY-011).

orchestration:
  pattern: >
    Agents are layer-scoped and communicate through a shared run context rather than calling each
    other freely. A layer agent may request an assessment from the layer above it (upstream) but
    may never trigger a promotion in a layer it does not own. This mirrors how the human team
    works and keeps accountability traceable.
  escalation_chain: "layer agent -> metric_guardian for impact -> human owner named in the rule"
  stop_condition: >
    Any agent that cannot resolve a decision with the knowledge retrieved must stop and escalate.
    It must not proceed on a plausible inference. In this domain a plausible inference that is
    wrong is more expensive than a delay, because the wrong answer propagates into decisions that
    are hard to unwind.

decision_record_schema:
  purpose: >
    This is how the KB grows. Every non-trivial decision — by a human or an agent — is captured
    in this shape, embedded, and becomes retrievable context with confidence: shop_specific.
    Over time these decision records become the most valuable part of the KB because they encode
    what is true about this client, which no public source contains.
  fields:
    decision_id:        "DR-YYYYMMDD-nnn"
    title:              "Phrased as the question that was faced"
    layer:              "landing | bronze | silver | identity | silver_ods | serving"
    trigger:            "What prompted it: rule failure id, drift event, human question, incident"
    context:            "The situation, with the specific feed, table, and period named"
    options_considered: "List. Including the ones rejected — the rejections carry most of the signal"
    decision:           "What was chosen"
    rationale:          "Why, in the analyst's own reasoning terms"
    decided_by:         "Human name/role, or agent id with the human who approved"
    downstream_impact:  "Metrics and consumers affected, from lineage"
    reversibility:      "reversible | reversible_with_restatement | irreversible"
    supersedes:         "Prior decision_id if this replaces one"
    review_by:          "Date, where the decision depends on a volatile fact"
    generalisable:      "boolean — true only if it would hold for another client. Default false."
  write_back_rules:
    - "Agents draft decision records; a human approves before the record is embedded."
    - >
      A superseded record is retained and marked, never deleted. The history of how a definition
      changed is exactly what an auditor asks for and what a new analyst needs.
    - >
      Records with generalisable: false must be filtered out of retrieval for any other tenant.
      Cross-tenant leakage of shop_specific decisions is both a correctness failure and a
      confidentiality failure.
    - >
      When a decision record contradicts a KB node, the record wins for that tenant and the
      conflict is flagged for KB maintenance rather than silently tolerated.

context_assembly_pattern:
  description: "What to put in the LLM call, in order."
  slots:
    1_role: "You are a value-based healthcare data analyst operating at the {layer} layer."
    2_operating_rules: "3-5 always-on nodes: KB-PLY-001, KB-PLY-011, KB-XLR-001, plus the layer contract."
    3_retrieved_knowledge: "6-8 reranked nodes, layer-filtered."
    4_tenant_decisions: "Any decision records matching the entity or metric in question."
    5_live_state: "Run manifest, schema registry entry, lineage for affected objects, recent change log."
    6_task: "The actual question or event."
  ordering_rationale: >
    Operating rules go before retrieved knowledge because they govern how retrieved knowledge is
    used. Live state goes last and closest to the task because it is what the model most needs to
    reason over and is most likely to be ignored if buried.

guardrails:
  - id: GR-01
    rule: "No PHI in prompts, embeddings, logs, or the KB."
    detail: >
      The agent reasons over metadata, counts, distributions, and rules. Where an example row is
      genuinely needed for debugging, it must be synthetic or de-identified before it enters the
      context window. Minimum necessary applies to agents exactly as it applies to people.
  - id: GR-02
    rule: "No autonomous writes to published tables or external submissions."
    detail: >
      Agents propose; humans approve for anything that changes a number someone has seen or will
      file. This is not a maturity limitation to be relaxed later; it is the accountability model.
  - id: GR-03
    rule: "Cite the governing node."
    detail: >
      Every assertion of a rule must name the node id it came from. An assertion the agent cannot
      attribute is an assertion it should not make. This makes hallucinated domain rules
      immediately visible to a reviewer.
  - id: GR-04
    rule: "Volatile facts are checked, not recalled."
    detail: >
      Model versions, programme dates, and measure years change annually. If a retrieved node is
      past its review_by, the agent surfaces the staleness rather than using the fact. It must
      never supply a regulatory parameter from its own training data.
  - id: GR-05
    rule: "Distinguish measurement change from care change."
    detail: >
      Whenever a metric improves, the agent must explicitly consider and state whether measurement
      improved rather than care. Conflating them causes management to celebrate a data fix and
      stop an intervention.
  - id: GR-06
    rule: "Never optimise a quality or risk metric directly."
    detail: >
      An agent that proposes changes to inclusion logic, acceptable sources, or exclusions in
      order to improve a reported rate or a risk score is generating audit exposure regardless of
      technical defensibility. Metric logic follows the specification; only the specification
      owner changes it, and only with a recorded rationale.
  - id: GR-07
    rule: "Refuse rather than approximate on settlement, submission, and clinical worklists."
    detail: >
      For these three consumers, an unavailable answer is acceptable and an approximate one is
      not. Elsewhere, an approximation with a stated bias direction is fine.

evaluation:
  description: "How to know the agent has actually acquired the domain knowledge."
  test_classes:
    - name: artifact_vs_reality
      method: >
        Inject known pipeline changes and confirm the agent attributes the resulting metric
        movement to the pipeline rather than generating a clinical narrative. This is the single
        most important behaviour and the one LLMs fail by default.
    - name: layer_discipline
      method: "Ask a Silver-layer question while the agent is scoped to Bronze; it should decline or redirect."
    - name: refusal_quality
      method: "Pose questions the data cannot answer; score on gap naming and bias direction, not fluency."
    - name: volatile_fact_handling
      method: "Query a regulatory parameter with a stale node; the agent must flag staleness, not answer."
    - name: blast_radius_recall
      method: "Present a drift event; score whether affected metrics are named specifically from lineage."
    - name: decision_reuse
      method: "Re-present a situation covered by an existing decision record; the agent must apply it rather than re-derive."
  regression_discipline: >
    Every production incident becomes a permanent eval case and, where it revealed missing
    knowledge, a new KB node. The KB and the eval set grow together or the agent silently decays.

implementation_notes:
  vector_store: >
    Store node id, embedding, and the full metadata block as payload. Keep the relational metadata
    catalogue as the system of record and the vector store as a derived index, so the KB can be
    re-embedded when the embedding model changes without losing governance state.
  lineage_dependency: >
    Several behaviours here (blast radius, downstream impact, DQ-X-05) require column-level
    lineage. Without it the agent degrades to a fluent commentator. If lineage is not yet
    available, that is the highest-value engineering prerequisite, ahead of adding more knowledge.
  cold_start: >
    Files 01-07 are portable across VBHC clients. The decision records are not and start empty.
    Expect the agent to be useful on day one for reasoning and structurally naive about this
    client until roughly fifty decision records accumulate. Seed them by interviewing the senior
    analyst about the last ten times a number was wrong.
