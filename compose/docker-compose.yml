# ─────────────────────────────────────────────────────────────────────────────
# cinqflow — the BASE. The app tier, and only the app tier.
#
# What is here is true in every environment: a backend that serves the BFF and
# a frontend that renders what the BFF says. What ISN'T here is every piece of
# infrastructure, because whether the platform BRINGS a database or CONNECTS TO
# one is exactly the difference between local, dev and prod — and the socket
# ladder says that difference lives in the profile and the overlay, never in
# the application.
#
#   docker-compose.local.yml   rung 1  · the twin: everything containerized
#   docker-compose.dev.yml     rung 1  · the twin, built and closed down
#   docker-compose.prod.yml    rung 3  · app tier only; infra is the client's
#
# Never run this file alone. Use the Makefile at the repo root:
#     make up ENV=local · make up ENV=dev · make up ENV=prod
# ─────────────────────────────────────────────────────────────────────────────
name: ${COMPOSE_PROJECT_NAME:-cinqflow}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRA_REQUIREMENTS: ${CINQFLOW_EXTRA_REQUIREMENTS:-}
        SPACY_MODEL: ${CINQFLOW_SPACY_MODEL:-en_core_web_lg}
    image: cinqflow/backend:${CINQFLOW_IMAGE_TAG:-local}
    # THE ONE FILE. Every CINQFLOW_SECRET_* the `secrets` pin resolves arrives
    # this way, so a new secret is a line in .env and a line in the profile —
    # never a change to this file and never a change to code.
    env_file: [.env]
    environment:
      # The profile IS the environment difference. Overridden per overlay.
      CINQFLOW_HOST: 0.0.0.0
      CINQFLOW_PORT: "8000"
    restart: unless-stopped

  # The tick-then-drain loop, always on — see `installer.cli.serve_worker`.
  # Same image as `backend`, a different command per overlay, the same way
  # `backend` itself already varies its command per overlay.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        EXTRA_REQUIREMENTS: ${CINQFLOW_EXTRA_REQUIREMENTS:-}
        SPACY_MODEL: ${CINQFLOW_SPACY_MODEL:-en_core_web_lg}
    image: cinqflow/backend:${CINQFLOW_IMAGE_TAG:-local}
    env_file: [.env]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    image: cinqflow/frontend:${CINQFLOW_IMAGE_TAG:-local}
    env_file: [.env]
    environment:
      # What the BROWSER calls — resolved in the browser, not on the compose
      # network, which is why it is a host/public origin and not `backend:8000`.
      CINQFLOW_API: ${CINQFLOW_API:-http://127.0.0.1:8000}
      PORT: "3000"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
