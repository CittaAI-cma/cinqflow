# Rung 0.5 — the CI plane. Identical to local.yaml except where CI must be stricter.
#
# The differences are all assertions, not conveniences:
#   • the LLM pin is `scripted` by default — Lanes 1 and 2 hold NO credentials,
#     so a test that reaches a real endpoint fails loudly instead of quietly
#     passing. The `agent-evals` job overrides this pin, and ONLY that job.
#   • cost caps are asserted, not advisory.

profile_version: 1
rung: 0.5
socket: postgres_plane
mode: full

pins:
  # Same honesty rule as local.yaml: a name with nothing registered behind it
  # now fails `conformance --profile profiles/ci.yaml` instead of certifying
  # GREEN against an unrelated mock.
  compute_job:    { adapter: none }
  orchestration:  { adapter: none }
  storage:        { adapter: none }
  connector:      { adapter: none }   # nothing is delivered in CI
  control_tables: { adapter: pg-control, schema: control }
  catalog:        { adapter: none }
  sql_query:      { adapter: none }
  identity:       { adapter: mock, scenarios: goldensets/reference/verato-scenarios.yaml }
  legacy_readonly: { adapter: none }
  # A reference, not a value — even in CI, and even for a throwaway container.
  # The one profile that embeds a DSN is the one that teaches everyone else to.
  metadata_db:    { dsn: "secret://pg-dsn" }
  queue:          { adapter: none }
  cache:          { adapter: none }
  authn:          { adapter: static, users: profiles/dev-users.yaml }
  secrets:        { adapter: dotenv, path: ".env" }
  llm:            { adapter: mock }           # scripted — overridden ONLY by the agent-evals job
  vector:         { adapter: none }
  phi_scrub:      { adapter: none }
  notification:   { adapter: none }
  observability:  { adapter: none }
  http_edge:      { adapter: none }
  agent_runtime:  { adapter: inproc, tracing: off }

landing:
  layout: "{domain}/{source_system}/{feed}/{folder}/{business_date}"
  folders: [incoming, processed, rejected, archive, parked]

agents:
  pipeline_insight:
    risk_class: R0
    tool_whitelist: read_only
  fingerprint_match:
    risk_class: R2
    tool_whitelist: read_only

assertions:
  cost_caps_enforced: true       # a prompt change that doubles spend fails CI like a broken unit test
  lanes_1_2_credential_free: true
