# Rung 0 — the mock socket. Nothing runs but Python.
#
# Lanes 1 and 2 hold NO live credentials, so a misclassified test fails loudly.
#   docs/architecture/INVARIANTS.md, testing

profile_version: 1
rung: 0
socket: mock
mode: full

pins:
  # Every name here is the adapter's ACTUAL registration ("mock" for every
  # pin whose only Wave-0 implementation is the in-memory stand-in) — not the
  # descriptive nickname the module docstring uses (memfs, canned, patterns,
  # ...). conformance/kit.py:check_pin fails a name that isn't registered, so
  # this profile is now checkable, not merely aspirational.
  compute_job:    { adapter: mock }
  orchestration:  { adapter: mock }
  storage:        { adapter: mock }
  # CF-V1-E8-09. Every route is named, never a bare adapter — `default` is
  # what an `endpoint_ref` that names no explicit route falls back to.
  connector:      { routes: { default: { adapter: mock } } }
  control_tables: { adapter: mock }
  catalog:        { adapter: mock }
  sql_query:      { adapter: mock }
  identity:       { adapter: mock }
  legacy_readonly: { adapter: none }
  document_parse:  { adapter: mock }
  metadata_db:    { adapter: mock }
  queue:          { adapter: mock }
  cache:          { adapter: none }
  authn:          { adapter: static, users: profiles/dev-users.yaml }
  secrets:        { adapter: mock }
  llm:            { adapter: mock }           # NO endpoint, NO key — by construction
  vector:         { adapter: mock }
  phi_scrub:      { adapter: mock }
  notification:   { adapter: mock }
  observability:  { adapter: mock }
  http_edge:      { adapter: mock }
  agent_runtime:  { adapter: inproc, tracing: off }

landing:
  layout: "{domain}/{source_system}/{feed}/{folder}/{business_date}"
  folders: [incoming, processed, rejected, archive, parked]

agents:
  pipeline_insight:
    risk_class: R0
    tool_whitelist: read_only
  fingerprint_match:
    risk_class: R2
    tool_whitelist: read_only
  alert_enrichment:
    risk_class: R0
    tool_whitelist: read_only
