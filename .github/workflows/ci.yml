# CINQFLOW CI — the gate set only ever grows.
#
# Wave 0 lights the first four rows of the table in
# memory/03-directives/01-definition-of-done.md. Every later wave adds gates;
# no wave removes one.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    # Gate: "Core-purity lint (zero vendor imports under core/)" — W0 — proves Law 1, mechanically.
    name: lint · Law 1 made mechanical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy
      - name: import-linter · the Law-1 contracts
        run: lint-imports
      - name: core-purity · URLs, paths, regions, credentials
        run: python -m conformance.lint_core_purity src/cinqflow/core
      - name: detect-secrets
        run: detect-secrets scan --baseline .secrets.baseline

  unit-contract:
    # Gate: "Full pyramid layers 1-2 on the mock socket (seconds)" — W0 — proves the core's logic on every commit.
    name: unit + contract · the mock socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: layers 1-2 — no services running, no credentials present
        # `acceptance` runs here too: the Wave-2 story suite is mock-driven
        # and credential-free, and a story suite CI never runs is a demo
        # somebody has to remember to perform.
        run: pytest -m "unit or contract or acceptance" -q --cov=cinqflow --cov-report=term-missing

  pipeline:
    # Gate: "Golden pipelines + invariants on the twin (minutes)" — W0 — proves the whole platform end to end.
    name: pipeline · golden sets + invariants on the Postgres plane
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinqflow
          POSTGRES_PASSWORD: cinqflow
          POSTGRES_DB: cinqflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CINQFLOW_PROFILE: profiles/ci.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: provision the rung-0.5 plane
        run: cinqflow install --profile "$CINQFLOW_PROFILE"
      - name: layers 3-4 — each test in a rolled-back transaction
        run: pytest -m "pipeline or invariant" -q -n auto
      - name: the Wave-2 exit — the demo is the test run
        run: ./scripts/wave2-demo.sh

  conformance:
    # Gate: "one check per energized pin, each naming its pin" — W0 — proves
    # plug-and-play never regresses, and that fitting an adapter is a
    # CERTIFICATION rather than a migration.
    name: conformance · certify the socket, pin by pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: 20 pins + the platform laws
        run: python conformance/kit.py

  ui:
    # Gate: "twin-e2e — the script plus Playwright, asserted" — W0 — proves the
    # demo cannot silently rot, and that the Read-Only denial holds in a browser.
    name: ui · typecheck, build, and the workspace end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - run: npm ci
        working-directory: ui
      - name: the design system is tokens, not literals
        # A colour literal or a raw spacing value outside globals.css is a
        # value nobody can restyle. The rule existed as a comment before this
        # step existed; the previous stylesheet had twelve distinct spacing
        # values in 130 lines and nobody had done anything wrong.
        run: npm run lint:tokens
        working-directory: ui
      - name: the OpenAPI document is the UI's contract
        run: npx tsc --noEmit
        working-directory: ui
      - run: npx next build
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: sign-in · denial · citations · lexicon · a11y · the design system
        run: npx playwright test
        working-directory: ui
        env:
          CI: "true"

  agent-evals:
    # Gate: "Lane 3 — plan coverage · invented steps = 0 · citations · refusals
    # · cost" — W0 — proves no AI capability degrades quietly.
    #
    # SKIPS with an explicit message until CINQFLOW_SECRET_LLM_* are set. No
    # evaluation threshold may be claimed from Lane 1 (mock) or Lane 2 (replay),
    # so a green tick here without those secrets means "not measured", never
    # "measured and fine". The job prints which variables are unset.
    #
    # THE SECOND WAY THIS JOB WENT GREEN WITHOUT MEASURING ANYTHING: every gate
    # grades against the client's workbooks, which live OUTSIDE this repository
    # in `clientdata/`. A checkout does not have them, so all of them skipped
    # and the tick above meant nothing — the comment guarded the credentials
    # and not the answer key. `CINQFLOW_REQUIRE_CORPUS` now turns that skip
    # into a failure wherever the corpus is expected, so this job is honest in
    # both directions or it is red. It is set only when the corpus is actually
    # mounted; until then the skip is still the truthful outcome and says so.
    name: agent-evals · Lane 3, the only lane that may make a quality claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements/dev.txt && pip install -e . --no-deps
      - name: the corpus, where this runner has it
        id: corpus
        # The gates read `../clientdata` relative to the repository root — the
        # layout every developer machine already has. Where a runner mounts it
        # (a self-hosted one, or a checkout of the corpus repository into the
        # parent directory), say so and the gates become mandatory.
        run: |
          if [ -d "${GITHUB_WORKSPACE}/../clientdata/Uploads" ]; then
            echo "require=1" >> "$GITHUB_OUTPUT"
            echo "corpus present — Lane 3 gates are MANDATORY in this run"
          else
            echo "require=" >> "$GITHUB_OUTPUT"
            echo "::warning title=Lane 3 not measured::the client corpus is absent, so every"\
                 "gate that grades against it will SKIP. This run makes no quality claim."
          fi
      - name: Lane 3
        env:
          CINQFLOW_SECRET_LLM_ENDPOINT: ${{ secrets.CINQFLOW_SECRET_LLM_ENDPOINT }}
          CINQFLOW_SECRET_LLM_KEY: ${{ secrets.CINQFLOW_SECRET_LLM_KEY }}
          CINQFLOW_SECRET_LLM_MODEL_SMALL: ${{ secrets.CINQFLOW_SECRET_LLM_MODEL_SMALL }}
          CINQFLOW_SECRET_LLM_MODEL_LARGE: ${{ secrets.CINQFLOW_SECRET_LLM_MODEL_LARGE }}
          CINQFLOW_REQUIRE_CORPUS: ${{ steps.corpus.outputs.require }}
        run: pytest -m evaluation -q -rs

  architecture-drift:
    # Gate: the atlas and its generated docs cannot diverge.
    name: architecture-drift · the atlas is the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: the pack is generated, never hand-edited
        working-directory: ../ours/cinqflow-knowledge-pack
        continue-on-error: true   # the pack lives outside this repo until it is vendored
        run: python3 tools/build_knowledge.py --check
