# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "Beneficiary MBI ID, MBI_original, MBI_previous, aligned_inpi, aligned_tin and every PALMR identifier are hashed; names, address lines, city, ZIP and the aligned provider, TIN, affiliate and organisation names are faked; every date column is date-faked."
  - The profile report says the source is .xlsx while the supplied file is CSV.
  - The Members by State chart in the profile report disagrees with the data and should be ignored.

quirks:
  - "Beneficiary Line 3 to 6 Address arrive as 40 spaces rather than empty on 75,526 rows, a fixed-width remnant. Trim before any null test or the null rate reads as zero."
  - "High Risk Score Indicator holds the literal string ',,' on the 10,252 rows from file date 20240116, a quoting or column-shift artefact in that month's file."
  - "BENE_DUAL_STUS_CD_desc_long contains a mis-encoded UTF-8 replacement character in the Qualifying Individual description, so the source was written in a non-UTF-8 code page."
  - Seven trailing columns are placeholders that are empty on every row.
  - "This is a curated roster, not a raw CMS file: CMS Alignment Report columns in Title Case are joined to PALMR and RAP reference reports and to derived lower-snake fields."

notes: >
  The alignment roster is the denominator of the ACO REACH contract, so its beneficiary count is
  a settlement input rather than a data-quality statistic. MBI_original and MBI_previous carry the
  Medicare identifier change history that CCLF9 exists to provide, which makes this feed the
  authoritative Medicare identity crosswalk for the D0284 population. Alignment Status tells you
  why a beneficiary left: MC moved to Medicare Advantage, DY died in the performance year, MS
  Medicare became the secondary payer, CO moved out of the service area, NV eligibility could not
  be verified, DD died before the performance year, AB lost Part A or Part B.
