contract: cms_aco_reach_d0284
line_of_business: "Medicare fee-for-service beneficiaries aligned to the REACH ACO; dual status carried in BENE_DUAL_STUS_CD"
file_pattern: "^D0284_AlignmentRoster\\.(xlsx|csv)$"
cadence: monthly
delivery: portal_download
arrival_archetype: restated_history

format:
  container: "named .xlsx but the bytes are comma-separated text - the reader must be configured as CSV"
  delimiter: ","
  quoting: "minimal, on free-text fields only"
  header: row 1
  line_terminator: CRLF
  encoding: "mostly ASCII; one description column carries mis-encoded UTF-8"
  trailer: none

business_date:
  source: "columns, not the file name"
  filedate: "YYYYMMDD integer - the CMS alignment report file date"
  yr_mo: "YYYY_MM - the alignment month"
  note: "mo is not zero-padded (1..12) while yr_mo is"

grain: one row per beneficiary per alignment month within a file date
natural_key: [aco_id, filedate, yr_mo, Beneficiary MBI ID]
secondary_identifiers: [MBI_original, MBI_previous]
key_note: >
  5,131 duplicate pairs sit in yr_mo 2023_12 (a December restatement written twice) plus 4 exact duplicate rows. In the pairs only de-identified columns differ, so in the real file they are almost certainly identical. Dedupe at Silver Raw with a collapse count, never in Bronze.

