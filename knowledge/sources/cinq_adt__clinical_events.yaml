version: 1
updated: "2026-09-03"

# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/cinq_adt/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/2-ADT/"
  - "docs/04_source_data_samples_and_profiles/2-ADT/ADT data for Payors Profile Report.pdf"

source_system: cinq_adt
feed: clinical_events
domain: adt
payer: "cross-cutting - nine payer and programme populations in one extract"
population: RecordSource identifies the population per row
contract: cross_cutting
line_of_business: "mixed Medicare, Medicaid and dual"
file_pattern: ^ADT data for Payors\.csv$
cadence: continuous
delivery: extract
arrival_archetype: append_only_event_stream

format:
  container: "comma-separated values"
  delimiter: ","
  quoting: "minimal - used for group names and the comma-joined diagnosis list"
  header: row 1
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none
  null_representation: "inconsistent: empty string, the literal NULL, '.', MISSING, NA, None, and 0 used both as false and as unknown"

business_date:
  source: "columns, not the file name"
  event_date: "EventDate = YYYY-MM-DD"
  note: The file name carries no date token.

grain: "one row per ADT event already matched to a member and enriched with care-management state"
natural_key: [ID]
secondary_identifiers: [OurID, MemberID, MemberMedicaidNumber, InsuranceIDPrimary]
key_note: >
  ID is the event record key and is unique. The business event key (MemberID, EventDate, EventType) has 30 duplicate rows, which is the expected multi-route duplication rather than a defect.

# Observed in the de-identified sample (437 rows, 142 columns).
sample_observed:
  rows: 437
  columns: 142
  blank_rows: 0
  rows_with_wrong_field_count: 0
  literal_null_tokens: ["NULL", None]

