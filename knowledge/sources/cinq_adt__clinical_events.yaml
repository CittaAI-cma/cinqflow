# these; the production feed has a different shape.
deid_artifacts:
  - "MemberID, MemberMedicaidNumber, PatientIdentifier, InsuranceIDPrimary and Secondary, UniqueID, MedentIDGBU, OurID, SubmittedByID, AdmittingPhyNPI and AttendingPhyNPI are hashed; member and physician names, email, phone, address, city, ZIP, Manager, Facility and Practice are faked; MemberDateOfBirth is date-faked."
  - "The column rn is a ROW_NUMBER partitioned by RecordSource running 1 to 50, so this sample is the top 50 events per payer rather than a real delivery. Row counts here say nothing about production volume."
  - "The profile report counts only empty strings as missing, so it reports 0.0% for columns that are entirely literal NULL."

quirks:
  - "This is an extract of CINQCARE's internal ADT and care-alert working table, already joined to member and care-management fields. It is not raw HL7 and does not match the nine-source Silver Raw encounter layout column for column."
  - "Roughly 60 care-management workflow columns are entirely NULL in the sample; they are populated by the CINQ application, not by any ADT source."
  - "AdmittingPhyNPI is 0 rather than null on 100 rows, and AttendingPhyNPI is 0 on 78."
  - "DischargeDispositionCode mixes UB-04 codes with free text such as 'Home or Self Care' and 'N/A' across 54 distinct values."
  - "Region uses inconsistent casing and vocabulary (UPSTATE, Upstate, UPSTATE NY, DOWNSTATE, Downstate, CA, IL, IN)."

notes: >
  Useful for understanding what CINQCARE's care teams actually work from, and for the identity
  crosswalk, because it carries OurID, the payer member id and the Medicaid CIN or MBI side by
  side. It is not the ADT ingestion contract: production ADT arrives as HL7 v2 through Mirth, as
  the ParticleHealth API, and as Optum and Fidelis flat files, and lands in the Silver Raw
  encounter table described in canonical/encounter.yaml.
