# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  EventType: [Emergency_Room_Discharge, Inpatient_Admission, Observation_Discharge, Inpatient_Admission_SNF]
  VisitType: [Care Alert Discharge ER, Care Alert Discharge Inpt, Care Alert Admit Inpt, Care Alert Discharge Observation]
  SERVCAT01: [Outpatient, Inpatient]
  SERVCAT02: [Emergency Room, Acute, SNF]
  MemberSex: [Female, Male]
  RecordSource: [ACO Fidelis, ACO Molina, AH ACOREACH, AIP ACOREACH, Centene GA, Centene IL, CINQ ACOREACH, CINQ MSSP, OPTUM NY]
  IPA: [CINQCARE, Alignment Health, BUIPA, Proactive]
  RiskCat: [LOW, HIGH, Critical, MISSING]

formats:
  dates: "AdmissionDate, DischargeDate, EventDate, CreateDate and the discharge date columns = YYYY-MM-DD"
  admit_time: "AdmitTime = h:MMAM or hh:MMPM, defaulting to 12:00AM on many rows"
  audit_timestamps: "the _LastEdit columns = YYYY-MM-DD HH:MM:SS.fff"
  md_visit: "MD_Visit_Scheduled_Date = MM/DD/YYYY, the only US-format date in the file"
  diagnosis: "DiagnosisList is a comma-joined list of codes and descriptions up to 1,709 characters"

