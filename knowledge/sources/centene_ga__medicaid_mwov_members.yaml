# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  LOB: [MEDICAID]
  MEMBER_SEX: [F, M]
  MEMBER_STATE: [GA]
  MEMBER_REGION: [ATLANTA]
  MEMBER_COUNTY: [CARROLL, PAULDING, HARALSON]
  MEMBER_ACTIVE_IND: [Y]

formats:
  dates: "MEMBER_DOB, MEMBER_ELIG_START_DT, MEMBER_ELIG_END_DT = YYYY-MM-DD"
  open_ended_coverage: "MEMBER_ELIG_END_DT = 9999-12-31 means coverage is open (96.5% of rows); treat as null, not as a date"
  member_name: "MEMBER_NAME is a single full-name field in 'FIRST LAST' order and must be parsed before mapping"
  phones: bare 10 digits
  identifiers: "MEMBER_KEY is GA + 11 digits; MEMBER_MEDICAID_ID is the 12-digit Georgia Medicaid id; PCP_PROV_KEY is GA<digits>-<digits>"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "EDW_MEMBER_CK, MEMBER_MEDICAID_ID, MEMBER_KEY, PCP_IRS_NBR, PCP_NPI and PCP_PROV_KEY are hashed; member and PCP names, addresses and phones are faked; MEMBER_DOB is date-faked."
  - "Three MEMBER_MEDICAID_ID cells hold a four-letter token rather than an id, most likely the literal NULL."
  - The profile PDF for this feed embeds chart images copied from the Centene IL and Optum GA reports; its tables are correct but its charts are not.

quirks:
  - "63 members (0.8%) carry no PCP at all, which fails the client's 'member must have a PCP assigned' rule. Recorded as exception EX-002 rather than a row-level reject."
  - "Three separate phone columns arrive, two of which are almost always empty (HOME 99.7%, CELL 95.3%)."
  - "The Medicare sibling feed shares the file-naming convention and column count but not the column set."

notes: >
  A Medicaid snapshot roster with the PCP attribution block carried inline. Every field is
  quoted, so a reader configured for minimal quoting will still parse it but will treat empty
  fields as the two-character string rather than null. MWOV is not expanded anywhere in the
  corpus or in public Centene material; do not assert an expansion.
