# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/centene_ga/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/3.GA CENTENE Medicaid/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/3.GA CENTENE Medicaid/Centene GA Medicaid Profile Report.pdf"

source_system: centene_ga
feed: medicaid_mwov_members
domain: enrollments
payer: Centene Georgia (Peach State Health Plan)
population: Medicaid MWOV Members
contract: centene_ga
line_of_business: Georgia Families Medicaid (LOB = MEDICAID on every row)
file_pattern: "^Medicaid MWOV Members - \\d{4}-\\d{2}-\\d{2}\\.txt$"
cadence: monthly
delivery: sftp
arrival_archetype: full_snapshot

format:
  container: "comma-separated values in a .txt file"
  delimiter: ","
  quoting: "every field and every header cell is double-quoted"
  header: row 1
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none
  empty_value: "\"\" (an empty quoted field)"

business_date:
  source: "file name suffix after ' - '"
  format: "YYYY-MM-DD"
  meaning: extract date
  example: "Medicaid MWOV Members - 2026-03-10.txt = extracted 10 March 2026"

grain: one row per active member (full snapshot)
natural_key: [MEMBER_KEY]
secondary_identifiers: [EDW_MEMBER_CK, MEMBER_MEDICAID_ID]

# Observed in the de-identified sample (7,817 rows, 34 columns).
sample_observed:
  rows: 7817
  columns: 34
  blank_rows: 0
  rows_with_wrong_field_count: 0

