version: 1
updated: "2026-09-03"

# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/cmp_1598/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/9.CMP_1598/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/9.CMP_1598/2461114_206_20260314032654_dmhmreport Data Profile Report.pdf"

source_system: cmp_1598
feed: patient_demographics
domain: enrollments
payer: "none - this is a practice-side export spanning 105 payers"
population: CMP_1598 practice patient list
contract: none
line_of_business: "mixed, determined per row by Primary Insurance Name and Secondary Insurance Name"
file_pattern: "^\\d+_\\d+_\\d{14}_dmhmreport_CCS_\\d+\\.csv$"
cadence: on_demand
delivery: manual_upload
arrival_archetype: full_snapshot

format:
  container: "comma-separated values"
  delimiter: ","
  quoting: "minimal - used for names with commas and multi-valued race"
  header: "row 1 - names contain spaces"
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none

business_date:
  source: file name
  format: YYYYMMDDHHMMSS in the third token
  meaning: report run timestamp
  example: "2461114_206_20260314032654_dmhmreport_CCS_53873287.csv = run 2026-03-14 03:26:54"
  note: The other numeric tokens are opaque; the corpus does not define them.

grain: one row per patient account per primary insurance
natural_key: [Account, Primary Insurance]
secondary_identifiers: [Secondary Insurance, Chart]
key_note: >
  Account alone is not unique: 10,224 distinct values across 10,800 rows, with up to 3 rows per account carrying different insurance.

# Observed in the de-identified sample (10,800 rows, 29 columns).
sample_observed:
  rows: 10800
  columns: 29
  blank_rows: 0
  rows_with_wrong_field_count: 0
  literal_null_tokens: [None]

# The 29 columns as they actually arrive, in file order.
expected_columns:
  - First Name
  - Middle
  - Last Name
  - Account
  - Address
  - Address1
  - City
  - State
  - Zip
  - Phone
  - Mobile
  - Work
  - Email
  - DOB
  - Sex
  - Race
  - Ethnicity
  - Language
  - Memo1
  - Memo2
  - Location
  - PCP
  - Chart
  - Primary Insurance
  - Primary Insurance Name
  - Secondary Insurance
  - Secondary Insurance Name
  - Last Appointment
  - Last Transc Triage

# Per-column facts the profiler measured. `null_pct` counts empty strings and literal
# null tokens. `phi` marks member-identifying columns (HIPAA Safe Harbor).
columns:
