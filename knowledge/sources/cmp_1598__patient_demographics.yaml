# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  Sex: [Female, Male, Unknown]
  Location: [Main Office, Linden, Jefferson, Atlantic, Linden Prior To 5/3/23, Atlantic Prior 5/3/23]

formats:
  dob: "DOB = YYYY-MM-DD"
  appointments: Last Appointment and Last Transc Triage = MM/DD/YYYY
  phone: "(999) 999-9999"
  race: "multi-valued, comma-joined, 76 distinct combinations"
  pcp: "PCP arrives as 'Last, First, Credential' and is a provider field, so the client's name-parsing rule explicitly excludes it"
  insurance_ids: "Primary Insurance holds whatever identifier the payer uses: 9 or 11 digits, a NY CIN, or an MBI"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "Account, Chart, Primary Insurance and Secondary Insurance are hashed; names, address, city, ZIP, phones and email are faked; DOB is date-faked."

quirks:
  - "Ethnicity carries the literal string 'None' on 277 rows, which is a value rather than a null."
  - "Secondary Insurance is the NY Medicaid CIN on 5,021 rows with Secondary Insurance Name 'Medicaid', which makes this feed a useful Medicaid identity crosswalk."
  - "Memo1 and Memo2 are free text used operationally (transportation, copay notes, payer ids) and carry no schema."
  - The folder label CMP_1598 and the tokens dmhmreport and CCS are not explained anywhere in the corpus.

notes: >
  A practice-management and EHR demographics export from a CINQ-affiliated practice, not a payer
  roster. Its value is identity: it links a patient account to primary and secondary payer
  identifiers across 105 payers, which supports crosswalk building and attribution checks. It
  should never be treated as an eligibility source, because coverage here is a practice's record
  of what it billed rather than the payer's record of who is covered.
