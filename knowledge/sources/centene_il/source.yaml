semantics:
  what_it_is: "A monthly member snapshot that also carries Centene's own analytics: a risk score, a population health category, a primary risk category and fourteen utilisation counters for the plan year to date."
  boundary: >
    Those analytic columns are Centene's calculations, not CINQCARE's. They are useful for
    care-management targeting and must never be presented as CINQCARE's own utilisation or risk
    measurement, because the definitions, periods and populations behind them are not ours.
  second_largest: "At roughly 25,800 lives under full risk this is the second largest contract after Fidelis."
