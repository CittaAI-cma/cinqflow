business_date:
  message_date: "MSH-7 for HeC; the Mirth received timestamp for every other HL7 source"
  event_dates: "PV1-44 admission and PV1-45 discharge"
  format_dispatch: "Admit and discharge timestamps arrive without separators in four lengths: 8 gives a date, 12 adds hours and minutes, 14 adds seconds, 17 adds milliseconds. The parse format is selected by string length."
  flat_file_dates: "Optum and Fidelis supply a file date and a date only, with no time component."
delivery_cadence:
  hl7: "continuous, message by message"
  fidelis_um: "every 15 minutes, which is why the incumbent leases a warm compute cluster for this feed"
  optum_um: daily
