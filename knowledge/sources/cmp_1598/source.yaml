semantics:
  what_it_is: "A patient demographics export spanning 105 payers, listing who the practice sees and what coverage it bills."
  value: "Identity. It links a practice patient account to primary and secondary payer identifiers side by side, which supports crosswalk building and attribution checks."
  boundary: >
    Never treat this as an eligibility source. Coverage here is a practice's record of what it
    billed, not the payer's record of who is covered, and the two disagree routinely.
