# Cross-cutting feeds that are not tied to one contract.
cross_cutting:
  adt:
    description: "ADT flows across every population and is the only feed fast enough to drive care-management intervention."
    sources:
      hl7_hie_via_mirth: [BronxRHIO, HiBridge, HealthIX, HealtheLink, HealtheConnections, "PCC National", "PCC IL"]
      api: [ParticleHealth]
      flat_file: ["Garage daily ADT", "Fidelis UM", "Optum UM"]
  enhanced_roster:
    vendor: Clinigence
    populations: ["Fidelis NY", "Molina NY", "Optum NY", "Centene IL"]
  practice_systems:
    - { name: "MEDENT (CMP_1598, CAH_152)", description: "Practice-management / EHR patient demographics exports from CINQ-affiliated practices; multi-payer, used for identity crosswalk and attribution." }
    - { name: "Athena", description: "Named in the technical architecture enrolment source list; no sample in the corpus." }

risk_arrangement_semantics:
  Full Risk: "CINQCARE bears the total cost of care against a benchmark. A missing member changes the denominator of the metric that determines settlement."
  Shared Savings: "Upside only or two-sided against a CMS benchmark (MSSP BASIC/ENHANCED tracks)."
  Gain Share: "Upside participation in savings, typically without downside."
  MSO with partial risk: "Management services with a small at-risk subset; most lives are administrative."
  Engagement only: "Outreach and assessment; no financial risk. Eligibility and attribution rules are weaker by design."
