# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  Health_Plan_State_code: [NY]
  Member_Gender: [M, F]
  Member_Health_Plan_Line_of_Business: [MEDICAID]
  Member_Health_Plan_Product: [HARP, ABD BH, TANF, TANF CHILD, "ABD NON-DUAL", "ABD LTC NON-DUAL", ESSENTIAL]
  Home_DNC_Flag: [Y, N]
  Mobile_DNC_Flag: [Y, N]
  Member_Ethnicity: [NO ETHNICITY, Hispanic or Latino]
  Member_Residence_Country: [UNITED STATES]

formats:
  dates_iso: "Member_Date_Of_Birth, Member_Date_Of_Death = YYYY-MM-DD"
  dates_us: "Member_Health_Plan_Enrollment_Effective_Date, _Termination_Date, Coverage_Effective_Date, Coverage_Term_Date = MM/DD/YYYY"
  month: Member_Month = YYYYMM integer
  phones: "bare 10 digits, no punctuation"
  identifiers: "Member_ID and Subscriber_ID are NYM + 11 digits; Medicaid_State_ID is the NY CIN (2 letters, 5 digits, 1 letter)"
  ratecode: "rate-premium-region, e.g. 2205-7580-NY; region suffixes seen NY, LI, NM, MH, WR; Medicaid files also use the short forms 2205-NY, 2201"
  spans: "enrollment effective/termination always equal coverage effective/term, and always bracket the Member_Month"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "Member_Date_Of_Death is 0% null with 99.6% of values in year 2078; the production feed is expected to be mostly null. Do not build a deceased rule from this sample."
  - "Member_ID, Subscriber_ID, Medicaid_State_ID, Medicare_Beneficiary_ID and Member_Enroll_ID are hashed."
  - "The profile PDF Column Summary reports 0.0% missing for faked columns that are largely empty; use Missing Value Analysis or the column facts here instead."

quirks:
  - "The layout is Molina's generic multi-line-of-business enrollment template, so 17 columns for Medicare, Marketplace and coordination-of-benefits are always empty for these Medicaid and HARP populations."
  - "File names are inconsistent: three use 'NYCINQ- <Down|Up> - <LOB>' with spaces and hyphens, the fourth is 'NYCINQUpstate_HARP' with neither. One regex must tolerate both."
  - Both a mailing and a physical address block arrive; each becomes a members_addresses row with its own address_type.
  - "Race appears twice under different code sets: Member_Ethnicity_or_Race (Molina codes) and Member_Race (OMB-style categories with mixed casing)."

notes: >
  Four population files share one 60-column layout and are delivered together. This is
  restated history, not an incremental: every delivery repeats the full period from the fixed
  start date, so loading it as an upsert without a key comparison will silently duplicate
  member-months. The enrollment canonical model has no home for coverage spans or member
  months, so the date and Member_Month columns land as unknown until the model is extended.
