# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/molina_ny/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/2.Molina NY/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/2.Molina NY/Molina NY MHI_NYCINQ- Down - HARP_NY_MCAID Health Data Profile.pdf"

source_system: molina_ny
feed: member_enrollment_history
domain: enrollments
payer: Molina Healthcare of New York
population: "NYCINQ- Down - HARP / Down - MEDICAID / Up - MEDICAID / NYCINQUpstate_HARP (four deliveries, one layout)"
contract: molina_ny
line_of_business: Medicaid Managed Care and HARP (Member_Health_Plan_Line_of_Business = MEDICAID on every row)
file_pattern: "^MHI_NYCINQ[ -_].*_NY_MCAID_\\d{8}_to_\\d{8}_\\d{8}_\\d{3}of\\d{3}_Data_MemEnrollHist\\.txt$"
cadence: monthly
delivery: sftp
arrival_archetype: restated_history

format:
  container: "pipe-delimited text"
  delimiter: "|"
  quoting: none (zero quote characters in the file)
  header: row 1
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none
  trailing_empty_fields: "the last 12 columns are always empty, so every line ends in a run of pipes - the reader must keep the field count at 60"

business_date:
  source: file name
  period_start: "token 1 (YYYYMMDD) - matches min Member_Month"
  period_end: "token 2 after _to_ (YYYYMMDD) - matches max Member_Month"
  extract_date: third date token (YYYYMMDD)
  part: _NNNofNNN part N of M; all samples are 001of001
  example: "MHI_NYCINQ- Down - HARP_NY_MCAID_20240201_to_20260131_20260223_001of001_Data_MemEnrollHist.txt = period 2024-02..2026-01, extracted 2026-02-23"

grain: "one row per member per coverage month (member-month history), restated in full each delivery"
natural_key: [Member_ID, Member_Month, Ratecode]
secondary_identifiers: [Medicaid_State_ID, Subscriber_ID]
key_note: >
  (Member_ID, Member_Month) is unique in three of the four files; the Down-MEDICAID file has 10 duplicate pairs that Ratecode resolves. Use the three-part key everywhere for consistency.

