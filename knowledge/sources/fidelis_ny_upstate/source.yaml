semantics:
  what_the_roster_is: >
    A monthly full snapshot of members attributed to CINQCARE under the Fidelis value-based
    payment arrangement, with the attributed PCP, care-management flags and Medicaid
    recertification dates carried inline.
  why_two_feeds: >
    Upstate and downstate are separate value-based payment populations under one contract. They
    share an identical 45-column layout and arrive in the same delivery, so a single file-name
    expression must match both while the population is distinguished by vbp_id.
  operational_use: "Recertification dates drive member outreach; the care-management and Health Home columns drive care-team worklists."
