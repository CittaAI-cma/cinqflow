semantics:
  what_it_is: "An outreach worklist, not a payer eligibility file. Each row is a member to be contacted and the state of that contact."
  consequence: >
    Rules written for a risk-bearing eligibility roster do not apply. There is no financial risk,
    the PCP is usually absent, and the columns that matter operationally (call status, substatus,
    appointment slot, visit type) have no home in the enrollment canonical model.
