# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/centene_ga/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/4.GA CENTENE Medicare/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/4.GA CENTENE Medicare/Centene GA Medicare MWOV Members Profile Report.pdf"

source_system: centene_ga
feed: medicare_mwov_members
domain: enrollments
payer: Centene Georgia (Wellcare Medicare Advantage)
population: Medicare MWOV Members
contract: centene_ga
line_of_business: Medicare Advantage (LOB = MEDICARE on every row)
file_pattern: "^Medicare MWOV Members - \\d{4}-\\d{2}-\\d{2}\\.txt$"
cadence: monthly
delivery: sftp
arrival_archetype: full_snapshot

format:
  container: "comma-separated values in a .txt file"
  delimiter: ","
  quoting: "every field and every header cell is double-quoted"
  header: row 1
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none

business_date:
  source: "file name suffix after ' - '"
  format: "YYYY-MM-DD"
  meaning: extract date

grain: one row per active member (full snapshot)
natural_key: [MEMBER_KEY]
secondary_identifiers: [MEMBER_MEDICARE_Nbr]

# Observed in the de-identified sample (7,731 rows, 34 columns).
sample_observed:
  rows: 7731
  columns: 34
  blank_rows: 0
  rows_with_wrong_field_count: 0

