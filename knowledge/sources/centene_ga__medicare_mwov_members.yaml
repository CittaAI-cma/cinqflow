# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  LOB: [MEDICARE]
  MEMBER_SEX: [F, M]
  MEMBER_STATE: [GA]
  MEMBER_REGION: [ATLANTA]
  MEMBER_ACTIVE_IND: [Y]
  WELL_VISIT: ["NO"]

formats:
  dates: "YYYY-MM-DD throughout"
  open_ended_coverage: "MEMBER_ELIG_END_DT = 9999-12-31 (54%) or the plan-year end 2026-12-31 (44%)"
  mbi: "MEMBER_MEDICARE_Nbr is an 11-character Medicare Beneficiary Identifier with no dashes"
  member_name: "MEMBER_NAME is a single full-name field"
  enrollment: "MEMBER_ELIG_START_DT is 2026-01-01 for 78% of members, which is plan-year enrolment rather than a true coverage start"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "MEMBER_KEY, MEMBER_MEDICARE_Nbr, PCP_IRS_NBR, PCP_NPI and PCP_PROV_KEY are hashed; names, addresses and phones are faked; MEMBER_DOB is date-faked."
  - "Two rows carry an implausible MEMBER_ELIG_END_DT of 2198-12-31."

quirks:
  - "Shares the file-name convention and the 34-column width of the Medicaid sibling but not its columns: this feed drops EDW_MEMBER_CK and MEMBER_MEDICAID_ID and adds MEMBER_MEDICARE_Nbr and WELL_VISIT."
  - "WELL_VISIT is NO on every row, which is consistent with a 'members without a wellness visit' worklist but does not confirm the MWOV expansion."
  - "PCP_PROV_KEY is a long composite of up to 40 characters (QGXCLXP...-...-...-V......)."
  - "PCPs are spread across 32 states, so out-of-state attribution is normal here."

notes: >
  The Medicare Advantage counterpart to the Medicaid MWOV roster. Its Medicare Beneficiary
  Identifier is the cross-feed identity key that joins to the ACO REACH alignment roster, the
  Optum eligibility files and the ADT extract for Medicare populations.
