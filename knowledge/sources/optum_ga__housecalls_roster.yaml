# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  Gender: [Female, Male]
  Member_State: [GA, NJ, AL]
  DNC_IND: [DNC]
  Visit_Type: [In Person, Video]
  Current_Status: [Attempted, Refused, Scheduled, Open, Cancelled, Completed]
  Spoken_Language: [English, Vietnamese, Korean, Spanish, Russian]

formats:
  dob: "DOB = YYYY-MM-DD"
  plan_dates: "Insured_Plan_Effective_Date = YYYY-MM-DD 00:00:00; Insured_Plan_Termination_Date = YYYY-MM-DD 23:59:58.963000 with the open-ended sentinel 9999-12-31 23:59:58.963000 on 98.5% of rows"
  outreach_dates: "Last_Attempted_Date and Slot_Start_Date = YYYY-MM-DD HH:MM:SS.ffffff, some without the fractional part"
  phone: "999-999-9999"
  pcp_tin: "PCP_TIN is a bracketed list string such as [],[999999999] - a member may have several TINs, and the empty first element is normal"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "MBI is faked into a 13-character hyphenated display form (9A9A9-A9-AA99); a real Medicare Beneficiary Identifier is 11 characters with no dashes."
  - "Member_Client_ID, Subscriber_ID, PCP_NPI and PCP_TIN are hashed; names, address, phone, email and PCP_Name are faked; DOB is date-faked."
  - "The profile PDF prints 0.0% missing for PCP_NPI, PCP_TIN, PCP_Name, Member_Email and DNC_IND, all of which are substantially empty."

quirks:
  - "This is an engagement and outreach worklist, not a payer eligibility file. It carries call-attempt state (Current_Status, Current_SubStatus, Last_Attempted_Date) and appointment slots rather than coverage history."
  - "PCP_NPI, PCP_TIN and PCP_Name are empty for 81.5% of members, so the client's 'member must have a PCP assigned' rule cannot apply here. Recorded as exception EX-001."
  - The profile report spells the column Current_Substatus; the file header is Current_SubStatus with a capital S.
  - "Household_Ref groups members in the same household and is populated for only 15.5% of rows."

notes: >
  HouseCalls is Optum's annual in-home clinical assessment programme, and this roster is the
  outreach list for it. The contract is engagement only, so no financial risk attaches to these
  members and the eligibility, attribution and PCP rules that govern a risk roster are the wrong
  rules to apply. Most of its columns describe outreach state, which the enrollment canonical
  model has no home for.
