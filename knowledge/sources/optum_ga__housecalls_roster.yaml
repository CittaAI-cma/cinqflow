# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/optum_ga/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/5.Optum GA/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/5.Optum GA/Optum GA _CINQ_HouseCalls_GA Profile Report.pdf"

source_system: optum_ga
feed: housecalls_roster
domain: enrollments
payer: Optum (UnitedHealthcare) HouseCalls
population: CINQ_HouseCalls_GA
contract: optum_ga
line_of_business: "Medicare Advantage and D-SNP (15 UnitedHealthcare plan names, mostly GA Dual Complete)"
file_pattern: "^\\d{4}-\\d{2}-\\d{2}_CINQ_HouseCalls_GA\\.xlsx$"
cadence: monthly
delivery: manual_upload
arrival_archetype: full_snapshot

format:
  container: "XLSX workbook, single sheet Sheet1"
  header: row 1
  cells: "every cell is stored as text, including dates - the reader must parse strings, never Excel serials"
  trailer: none

business_date:
  source: file name prefix
  format: "YYYY-MM-DD"
  meaning: extract date
  example: "2026-03-16_CINQ_HouseCalls_GA.xlsx = extracted 16 March 2026"

grain: one row per member on the outreach list (full snapshot)
natural_key: [Member_Client_ID]
secondary_identifiers: [MBI, Subscriber_ID, Household_Ref]

# Observed in the de-identified sample (3,814 rows, 30 columns).
sample_observed:
