version: 1
updated: "2026-09-03"
kind: delivery_convention
source_system: optum_ny
file_naming: { observed: "CINQCare_Elig_YYYYMM.csv", regex: "^CINQCare_Elig_\\d{6}\\.csv$" }
business_date:
  source: "file name suffix"
  format: YYYYMM
  meaning: "reporting month of the delivery"
  caution: "The reporting month is not the data range. The February 2026 file carries spans reaching back to 1 January 2023."
delivery: { cadence: monthly, method: manual_upload }
format: { container: "comma-separated values", delimiter: ",", quoting: none, header: "row 1", line_terminator: CRLF, encoding: "ASCII, no BOM", trailer: none }
arrival_archetype: restated_history
implies: "Spans are restated each month. Loading as a snapshot collapses a member's plan history; loading as an append duplicates spans."
