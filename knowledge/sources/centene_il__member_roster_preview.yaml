# Loader-facing feed contract. YamlKnowledgeProvider.get_source() reads this exact path;
# ContextBuilder injects it whole at file understanding and mapping. Richer organisational
# knowledge for this source is in sources/centene_il/.
#
# Columns, row counts, null rates and value shapes below were read from the de-identified
# sample and its profile report, not inferred.
grounded_in:
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/7.Centene IL/"
  - "docs/04_source_data_samples_and_profiles/1-Enrollment/7.Centene IL/Centene IL  Member_Roster_Preview_ Profile Report.pdf"

source_system: centene_il
feed: member_roster_preview
domain: enrollments
payer: Centene Illinois (Meridian / Wellcare of Illinois)
population: IL0201633
contract: centene_il
line_of_business: HealthChoice Illinois Medicaid (LINE OF BUSINESS = MEDICAID on every row)
file_pattern: "^Member_Roster_Preview_IL\\d{7}_\\d{6}\\.csv$"
cadence: monthly
delivery: manual_upload
arrival_archetype: full_snapshot

format:
  container: "comma-separated values"
  delimiter: ","
  quoting: none
  header: "row 1 - column names contain spaces"
  line_terminator: CRLF
  encoding: "ASCII, no BOM"
  trailer: none

business_date:
  source: file name suffix
  format: YYYYMM
  meaning: roster month
  example: "Member_Roster_Preview_IL0201633_202602.csv = February 2026, consistent with MEMBER MONTHS of 2 for most members"

grain: "one row per member (snapshot) with rolled-up utilisation counters for the plan year to date"
natural_key: [AMISYS NUMBER]
secondary_identifiers: [MEDICAID NUMBER]

