# Always empty in the sample. Emptiness here is a layout fact, not drift (DQ-B-03 must
# not fire on these) unless the registered contract says they were populated before.
expected_empty_columns:
  - MIDDLE NAME
  - MEMBER ADDRESS LINE 2
  - MEMBER TYPE

phi_columns:
  - AMISYS NUMBER
  - MEDICAID NUMBER
  - FIRST NAME
  - MIDDLE NAME
  - LAST NAME
  - MEMBER DOB
  - GENDER
  - MEMBER PHONE NUMBER
  - MEMBER ADDRESS LINE 1
  - MEMBER ADDRESS LINE 2
  - MEMBER CITY
  - MEMBER ZIP
  - MPK NAME
  - MEMBER MEDICAID START MONTH
  - EMAIL_ADDRESS

# Closed-domain columns and the values observed. A value outside these is DQ-B-07.
value_domains:
  GENDER: [F, M]
  LINE OF BUSINESS: [MEDICAID]
  PRODUCT: [MEDICAID, MEDICAID EXPANSION, "SSI NON - DUAL", SSI KIDS]
  PCP SPECIALTY: [CLINIC, NURSE PRACTITIONERS, FAMILY PRACTICE, PEDIATRICS, PHYSICIAN S ASSISTANT, INTERNAL MEDICINE]

formats:
  dob: "MEMBER DOB = YYYY-MM-DD"
  months: MEMBER ELIG START MONTH and MEMBER MEDICAID START MONTH = YYYYMM
  phone: "999-999-9999"
  risk_score: "RISK SCORE is a decimal with up to 5 places; 2,399 rows carry a whole number"
  identifiers: "AMISYS NUMBER is a letter followed by 10 digits; MEDICAID NUMBER is the 9-digit Illinois Recipient Identification Number"
  counters: "14 utilisation counters (admits, ED visits, claim counts, Rx counts) are small integers for the plan year to date"

# De-identification artefacts in the SAMPLE ONLY. Never tune a rule or threshold on
# these; the production feed has a different shape.
deid_artifacts:
  - "AMISYS NUMBER, MEDICAID NUMBER, ASSIGNED TIN and PCP NPI are hashed; member and PCP names, phone, address, city, ZIP, group names and email are faked; MEMBER DOB is date-faked."
  - "The profile report lists only MEMBER TYPE as having missing data, treating every faked column as complete; EMAIL_ADDRESS is in fact 59.7% empty and PCP MIDDLE NAME 68.3%."

quirks:
  - "This roster carries analytics as well as enrolment: a risk score, a population health category, a primary risk category and 14 utilisation counters. None of these have a home in the enrollment canonical model."
  - "MEMBER TYPE, MIDDLE NAME and MEMBER ADDRESS LINE 2 are effectively always empty."
  - "Column names contain spaces, and EMAIL_ADDRESS is the only name that uses an underscore."
  - "PREVENTABLE ADMITS and PREVENTABLE ED VISITS are zero on every row, which is a placeholder rather than a finding."

notes: >
  IL0201633 is a Centene-side roster identifier, most likely the contracted provider group. The
  corpus does not define it, so it is carried as an opaque population label rather than parsed.
  The utilisation counters make this feed useful for care-management targeting but they are
  derived values from Centene, not raw enrolment facts, and should never be treated as CINQCARE's
  own utilisation measurement.
